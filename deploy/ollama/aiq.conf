[Service]
# Let the containerized AI-Q backend reach Ollama through the Docker host gateway.
Environment="OLLAMA_HOST=0.0.0.0:11434"

# The RTX 5090 has enough VRAM for one large model plus its KV cache. Force
# eviction on model changes rather than allowing Ollama to keep several models
# resident at once.
Environment="OLLAMA_MAX_LOADED_MODELS=1"
Environment="OLLAMA_NUM_PARALLEL=1"
Environment="OLLAMA_MAX_QUEUE=64"

# Bound context/KV memory and use the Blackwell-friendly attention/cache path.
Environment="OLLAMA_CONTEXT_LENGTH=65536"
Environment="OLLAMA_KEEP_ALIVE=30m"
Environment="OLLAMA_FLASH_ATTENTION=1"
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"
