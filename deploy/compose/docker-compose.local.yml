services:
  searxng:
    image: searxng/searxng:latest
    container_name: aiq-searxng
    environment:
      SEARXNG_BASE_URL: http://localhost:8888/
    volumes:
      - ../../integrations/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - /etc/ssl/certs/ca-certificates.crt:/usr/local/share/ca-certificates/host-corporate-bundle.crt:ro
      - searxng-cache:/var/cache/searxng
    ports:
      - "8888:8080"
    networks:
      - aiq-network
    restart: unless-stopped

  searxng-mcp:
    build:
      context: ../../integrations/searxng_mcp
    image: aiq-searxng-mcp:2.2.0
    container_name: aiq-searxng-mcp
    environment:
      SEARXNG_URL: http://searxng:8080
      SEARXNG_TIMEOUT_SECONDS: "30"
    ports:
      - "9901:9901"
    networks:
      - aiq-network
    depends_on:
      - searxng
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; s=socket.create_connection(('localhost',9901),5); s.close()"
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  aiq-agent:
    environment:
      CONFIG_FILE: /app/configs/config_web_local_5090.yml
      LOCAL_LLM_BASE_URL: http://host.docker.internal:11434/v1
      LOCAL_LLM_MODEL: qwen3.8:27b
      LOCAL_LLM_API_KEY: ollama # pragma: allowlist secret
      NVIDIA_API_KEY: ollama # pragma: allowlist secret
      AIQ_EMBED_MODEL: qwen3-embedding:8b
      AIQ_EMBED_BASE_URL: http://host.docker.internal:11434/v1
      AIQ_RERANKER_MODEL: dengcao/Qwen3-Reranker-4B:Q8_0
      AIQ_RERANKER_BASE_URL: http://host.docker.internal:11434
      AIQ_RERANKER_CANDIDATES: "12"
      AIQ_CHROMA_DIR: /app/data/chroma
      NAT_JOB_STORE_DB_URL: postgresql+asyncpg://aiq:aiq_dev@postgres:5432/aiq_jobs # pragma: allowlist secret
      AIQ_CHECKPOINT_DB: postgresql://aiq:aiq_dev@postgres:5432/aiq_checkpoints # pragma: allowlist secret
      AIQ_SUMMARY_DB: postgresql+psycopg://aiq:aiq_dev@postgres:5432/aiq_jobs # pragma: allowlist secret
      SEARXNG_MCP_URL: http://searxng-mcp:9901/mcp
      DASK_NWORKERS: "1"
      DASK_NTHREADS: "2"
      DASK_MEMORY_LIMIT: 6GB
      AIQ_MAX_ACTIVE_DEEP_RESEARCH_JOBS_PER_PRINCIPAL: "1"
      AIQ_MAX_ACTIVE_DEEP_RESEARCH_JOBS_GLOBAL: "1"
    volumes:
      - ../../configs:/app/configs:ro
      - aiq-local-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      searxng-mcp:
        condition: service_healthy

volumes:
  aiq-local-data:
  searxng-cache:
