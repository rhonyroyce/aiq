use_default_settings: true

general:
  instance_name: "Local AI-Q Search"
  debug: false

server:
  bind_address: "0.0.0.0"
  port: 8080
  secret_key: "local-aiq-only-change-before-network-exposure" # pragma: allowlist secret
  limiter: false
  image_proxy: false

search:
  safe_search: 1
  autocomplete: ""
  formats:
    - html
    - json

outgoing:
  request_timeout: 10.0
  max_request_timeout: 20.0
